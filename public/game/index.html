<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anything Controller Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { border: 4px solid #333; border-radius: 8px; }
        #qr-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; z-index: 10; }
        #qrcode { background: white; padding: 15px; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="qr-overlay">
        <h1 id="qr-title">Loading Engine...</h1>
        <h2 id="room-display">Preparing assets...</h2>
        <div id="qrcode"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
